<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>TRAC Collector — Certificate of Authenticity</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23000'/><text x='50%25' y='50%25' dominant-baseline='central' text-anchor='middle' font-family='Arial,sans-serif' font-weight='700' font-size='18' fill='%23fff'>T</text></svg>">
    <link rel="preload" href="/fonts/space-grotesk-400.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/space-grotesk-500.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/space-grotesk-600.woff2" as="font" type="font/woff2" crossorigin>
    <style>
        @font-face {
            font-family: 'Space Grotesk';
            font-style: normal;
            font-weight: 300;
            font-display: swap;
            src: url('/fonts/space-grotesk-300.woff2') format('woff2');
        }
        @font-face {
            font-family: 'Space Grotesk';
            font-style: normal;
            font-weight: 400;
            font-display: swap;
            src: url('/fonts/space-grotesk-400.woff2') format('woff2');
        }
        @font-face {
            font-family: 'Space Grotesk';
            font-style: normal;
            font-weight: 500;
            font-display: swap;
            src: url('/fonts/space-grotesk-500.woff2') format('woff2');
        }
        @font-face {
            font-family: 'Space Grotesk';
            font-style: normal;
            font-weight: 600;
            font-display: swap;
            src: url('/fonts/space-grotesk-600.woff2') format('woff2');
        }
        @font-face {
            font-family: 'Space Grotesk';
            font-style: normal;
            font-weight: 700;
            font-display: swap;
            src: url('/fonts/space-grotesk-700.woff2') format('woff2');
        }
        @font-face {
            font-family: 'Space Grotesk Fallback';
            src: local('Arial');
            size-adjust: 120.977%;
            ascent-override: 81.3378%;
            descent-override: 24.1368%;
            line-gap-override: 0%;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Space Grotesk', 'Space Grotesk Fallback', sans-serif; }
        body { background: #fff; color: #000; line-height: 1.6; min-height: 100vh; opacity: 0; }
        body.loaded { opacity: 1; transition: opacity 0.2s ease; }

        /* NAV - same header classes as app.html's Dashboard, verbatim, minus
           .header-left/.gallery-nav (collector has no multi-page nav to show). */
        .gallery-header { background: white; border-bottom: 1px solid #e5e5e5; padding: 1rem 0; position: sticky; top: 0; z-index: 100; }
        .header-container { max-width: 1400px; margin: 0 auto; padding: 0 2rem; display: flex; justify-content: space-between; align-items: center; }
        .logo-container { background: #000000; border-radius: 12px; padding: 0.75rem 1.25rem; display: inline-flex; align-items: center; justify-content: center; }
        .gallery-logo { font-size: 2.2rem; font-weight: 600; letter-spacing: -0.02em; color: #ffffff; margin: 0; line-height: 1; }
        .icon-button { background: none; border: none; padding: 0.5rem; cursor: pointer; color: #666; transition: color 0.2s; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
        .icon-button:hover { color: #000; background: #f5f5f5; }
        /* Still used by the certificate view's own branded header (openCertView). */
        .c-logo-badge { display: inline-flex; align-items: center; justify-content: center; background: #000; color: #fff; font-weight: 600; letter-spacing: 0.02em; border-radius: 6px; padding: 0.5rem 0.9rem; font-size: 1rem; }
        .c-btn { padding: 0.5rem 1rem; border-radius: 8px; font-size: 0.85rem; font-family: inherit; cursor: pointer; transition: all 0.2s; }
        .c-btn-primary { background: #000; color: white; border: none; }
        .c-btn-primary:hover { background: #333; }
        .c-btn-outline { background: white; color: #000; border: 1px solid #d1d1d1; }
        .c-btn-outline:hover { border-color: #000; }

        /* AUTH SCREENS */
        .c-auth-wrap { min-height: calc(100vh - 64px); display: flex; align-items: center; justify-content: center; padding: 2rem; }
        .c-auth-box { width: 100%; max-width: 420px; border: 1px solid #e5e5e5; border-radius: 16px; padding: 2.5rem; }
        .c-auth-box h2 { font-size: 1.5rem; font-weight: 500; letter-spacing: -0.02em; margin-bottom: 0.5rem; }
        .c-auth-box .sub { color: #666; font-size: 0.875rem; margin-bottom: 2rem; }
        .c-form-group { margin-bottom: 1rem; }
        .c-form-group label { display: block; font-size: 0.83rem; font-weight: 500; margin-bottom: 0.4rem; color: #333; }
        .c-form-group input { width: 100%; padding: 0.8rem 1rem; border: 1px solid #d1d1d1; border-radius: 8px; font-size: 0.9rem; font-family: inherit; transition: border-color 0.2s; }
        .c-form-group input:focus { outline: none; border-color: #000; }
        .c-submit { width: 100%; padding: 0.875rem; background: #000; color: white; border: none; border-radius: 8px; font-size: 0.9rem; font-family: inherit; font-weight: 500; cursor: pointer; margin-top: 0.5rem; }
        .c-submit:hover { background: #333; }
        .c-submit:disabled { background: #999; cursor: not-allowed; }
        .c-switch { text-align: center; margin-top: 1.25rem; font-size: 0.85rem; color: #666; }
        .c-switch a { color: #000; text-decoration: underline; cursor: pointer; }
        .c-divider { height: 1px; background: #e5e5e5; margin: 1.5rem 0; }
        .c-error { background: #fef2f2; border: 1px solid #fecaca; border-radius: 8px; padding: 0.75rem 1rem; font-size: 0.85rem; color: #dc2626; margin-bottom: 1rem; display: none; }

        /* MAIN DASHBOARD */
        .c-main { max-width: 960px; margin: 0 auto; padding: 2.5rem 1.5rem; }
        /* Same hero and section-title classes as app.html's Dashboard/Blockchain, verbatim. */
        .hero-section { padding: 3rem 0 2rem; text-align: center; }
        .hero-container { max-width: 800px; margin: 0 auto; padding: 0 2rem; }
        .hero-title { font-size: 2.25rem; font-weight: 500; margin-bottom: 0.75rem; letter-spacing: -0.02em; }
        .hero-subtitle { font-size: 1rem; color: #666; font-weight: 400; }
        .section-header { max-width: 1400px; margin: 0 auto 3rem; padding: 0 2rem; display: flex; justify-content: space-between; align-items: center; }
        .section-title { font-size: 1.25rem; font-weight: 500; letter-spacing: -0.02em; }

        /* COLLECTION TOOLBAR */
        .c-collection-toolbar { display: flex; gap: 0.75rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
        .c-collection-toolbar input[type="search"] { flex: 1; min-width: 200px; padding: 0.7rem 1rem; border: 1px solid #d1d1d1; border-radius: 8px; font-size: 0.88rem; font-family: inherit; }
        .c-collection-toolbar input[type="search"]:focus { outline: none; border-color: #000; }
        .c-collection-toolbar select { padding: 0.7rem 1rem; border: 1px solid #d1d1d1; border-radius: 8px; font-size: 0.88rem; font-family: inherit; background: white; cursor: pointer; }
        .c-collection-toolbar select:focus { outline: none; border-color: #000; }

        /* CoA conveyor belt - same classes as app.html's Dashboard/Blockchain
           conveyor belt, verbatim (event-card variants omitted, unused here). */
        .conveyor-belt-container {
            width: 1400px;
            margin: 2rem 48px 2rem 32px;
            overflow-x: auto;
            padding: 2rem 0;
            clip-path: inset(0 43px 0 25px);
            position: relative;
            left: -32px;
            max-width: calc(100vw - 80px);
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .conveyor-belt-container::-webkit-scrollbar { height: none; }
        .conveyor-belt-container::-webkit-scrollbar-track { background: transparent; }
        .conveyor-belt-container::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.15); border-radius: 1px; width: 30% !important; margin: 0 auto; }
        .conveyor-belt-container::-webkit-scrollbar-thumb:hover { background: rgba(0, 0, 0, 0.25); width: 40% !important; }
        .conveyor-belt-track {
            display: flex;
            gap: 2rem;
            padding: 0 32px;
            width: fit-content;
            max-width: 100%;
            min-width: auto !important;
            box-sizing: border-box;
            position: relative;
            left: 32px;
        }
        .conveyor-item { flex: 0 0 auto; width: 350px; height: 400px; scroll-snap-align: start; }
        .conveyor-item.artwork-card { margin-bottom: 0; height: 100%; display: flex; flex-direction: column; border: none; border-radius: 0; overflow: visible; background: transparent; box-shadow: none; }
        .conveyor-item .artwork-image { height: 70%; flex-shrink: 0; overflow: hidden; }
        .conveyor-item .artwork-image img { width: 100%; height: 100%; object-fit: cover; }
        .conveyor-item .artwork-info { flex: 1; display: flex; flex-direction: column; justify-content: space-between; padding: 1.5rem; }
        .conveyor-item.artwork-card .artwork-info { background: transparent; padding: 1rem 0.5rem; border: none; }
        .artwork-title { font-size: 0.8rem; font-weight: 500; margin-bottom: 0.2rem; }
        .artwork-details { color: #666; font-size: 0.7rem; line-height: 1.2; max-width: 100%; word-wrap: break-word; overflow-wrap: break-word; }
        .artwork-details div { max-width: 100%; word-wrap: break-word; overflow-wrap: break-word; }
        .c-badge { font-size: 0.68rem; padding: 0.2rem 0.6rem; border-radius: 20px; font-weight: 500; }
        .c-badge-green { background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }
        .c-badge-blue { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }
        .c-badge-gray { background: #f5f5f5; color: #666; border: 1px solid #e5e5e5; }

        /* MODAL */
        .c-modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 2147483647; }
        .c-modal { background: white; border-radius: 16px; max-width: 580px; width: 95%; max-height: 90vh; overflow-y: auto; padding: 2rem; }
        .c-modal-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 1.5rem; }
        .c-modal-header h3 { font-size: 1.2rem; font-weight: 500; letter-spacing: -0.02em; }
        .c-modal-close { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #666; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 8px; flex-shrink: 0; }

        /* COA CERTIFICATE VIEW */
        .coa-cert { border: 2px solid #000; border-radius: 12px; padding: 2rem; margin-bottom: 1.5rem; position: relative; }
        .coa-cert::before { content: ''; position: absolute; inset: 6px; border: 1px solid #e5e5e5; border-radius: 8px; pointer-events: none; }
        .coa-cert-header { text-align: center; margin-bottom: 1.5rem; padding-bottom: 1.25rem; border-bottom: 1px solid #e5e5e5; }
        .coa-cert-header .cert-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.15em; color: #666; }
        .coa-cert-row { display: flex; justify-content: space-between; margin-bottom: 0.75rem; align-items: baseline; }
        .coa-cert-row .key { font-size: 0.72rem; color: #999; text-transform: uppercase; letter-spacing: 0.05em; }
        .coa-cert-row .val { font-size: 0.875rem; font-weight: 500; text-align: right; max-width: 65%; }
        .coa-cert-hash { background: #f5f5f5; border-radius: 6px; padding: 0.625rem 0.75rem; margin-top: 1rem; }
        .coa-cert-hash .key { font-size: 0.68rem; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.2rem; }
        .coa-cert-hash .val { font-size: 0.68rem; font-family: monospace; word-break: break-all; color: #555; }

        /* ARTWORK IMAGE POPUP - same expand-on-click treatment as Blockchain's
           artworkPopup/openPopup in app.html, self-contained here since
           collector.html shares no JS/CSS with app.html. Deliberately NOT the
           Dashboard behavior (app.html's disableDashboardPopups turns this off
           there on purpose) - collector should behave like Blockchain. */
        #c-artwork-popup {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 999999;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        #c-artwork-popup .c-popup-close { position: absolute; top: 2rem; right: 2rem; background: rgba(0,0,0,0.7); color: white; border: none; width: 40px; height: 40px; border-radius: 50%; font-size: 1.5rem; cursor: pointer; backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: center; }
        #c-artwork-popup .c-popup-body { display: flex; align-items: flex-end; justify-content: center; gap: 1.5rem; max-width: 90vw; max-height: 90vh; }
        #c-popup-img { max-width: 70vh; max-height: 90vh; object-fit: contain; display: block; }
        #c-popup-info { flex-shrink: 0; width: 200px; }
        #c-popup-info .title { color: white; font-size: 1rem; font-weight: 500; margin-bottom: 0.5rem; }
        #c-popup-info .detail { color: white; font-size: 0.8rem; opacity: 0.8; margin-bottom: 0.2rem; }

        /* TOAST */
        #c-toast { position: fixed; top: 1.25rem; right: 1.25rem; background: #000; color: white; padding: 0.875rem 1.25rem; border-radius: 8px; font-size: 0.875rem; z-index: 9999999; display: none; max-width: 300px; }
        #c-toast.error { background: #dc2626; }

        /* EMPTY STATE */
        .c-empty { text-align: center; padding: 4rem 2rem; color: #999; }
        .c-empty svg { margin-bottom: 1rem; opacity: 0.3; }
        .c-empty h3 { font-size: 1.1rem; font-weight: 500; color: #666; margin-bottom: 0.5rem; }
        .c-empty p { font-size: 0.875rem; }

        @media (max-width: 600px) {
            .c-auth-box { padding: 1.75rem; border: none; }
        }

        /* Same conveyor-belt mobile overrides as app.html, verbatim, plus the
           #c-coa-grid-scoped width fix Blockchain needed for the same reason:
           .c-main keeps its own horizontal padding unlike Dashboard's
           .gallery-main, so the belt's 100vw sizing here overshoots it. */
        @media (max-width: 768px) {
            .conveyor-belt-container {
                position: relative !important;
                left: 0 !important;
                right: 0 !important;
                margin: 0 !important;
                padding: 0 !important;
                width: 100vw !important;
                max-width: 100vw !important;
                overflow-x: auto !important;
                overflow-y: hidden !important;
                -webkit-overflow-scrolling: touch !important;
                scrollbar-width: none !important;
            }
            .conveyor-belt-container::-webkit-scrollbar { display: none !important; width: 0 !important; height: 0 !important; }
            .conveyor-belt-track {
                display: flex !important;
                padding: 1rem 1rem 1rem 1rem !important;
                margin: 0 !important;
                gap: 1rem !important;
                width: max-content !important;
                min-width: 100% !important;
                box-sizing: border-box !important;
            }
            .conveyor-item {
                width: calc(100vw - 2rem) !important;
                max-width: 320px !important;
                min-width: 280px !important;
                flex-shrink: 0 !important;
                margin: 0 !important;
                scroll-snap-align: none !important;
            }
            body, html {
                overflow-x: hidden !important;
                max-width: 100vw !important;
                overflow-anchor: none !important;
            }
            #c-coa-grid .conveyor-belt-container {
                width: 100% !important;
                max-width: 100% !important;
            }
        }
    </style>
</head>
<body>

<!-- TOAST -->
<div id="c-toast"></div>

<!-- HEADER - same classes/structure as app.html's Dashboard header, minus
     the multi-page nav (collector has only one page). -->
<header class="gallery-header">
    <div class="header-container">
        <div class="logo-container">
            <h1 class="gallery-logo">TRAC</h1>
        </div>
        <!-- Populated by updateHeaderNav() once the session resolves - body stays
             opacity:0 until then, so there's no logged-out flash to fill here. -->
        <div id="c-header-nav"></div>
    </div>
</header>

<!-- ARTWORK IMAGE POPUP - click-to-expand, matches Blockchain's artworkPopup
     in app.html (not Dashboard's, which is deliberately disabled there). -->
<div id="c-artwork-popup">
    <button class="c-popup-close" onclick="closeCArtworkPopup()">×</button>
    <div class="c-popup-body">
        <img id="c-popup-img" src="" alt="">
        <div id="c-popup-info"></div>
    </div>
</div>

<!-- MAIN DASHBOARD (authenticated) -->
<div id="c-dashboard" style="display:none;">
    <main class="c-main">
        <section class="hero-section">
            <div class="hero-container">
                <h2 class="hero-title" id="c-welcome-name">My Collection</h2>
                <p class="hero-subtitle">Your Certificates of Authenticity — permanently linked to your physical artworks.</p>
            </div>
        </section>

        <!-- PENDING INCOMING TRANSFERS - populated by loadPendingIncomingTransfers() -->
        <div id="c-pending-transfers" style="display:none;"></div>

        <div class="section-header" style="padding: 0; max-width: none;">
            <h3 class="section-title">Your Certificates</h3>
        </div>

        <!-- COLLECTION TOOLBAR -->
        <div class="c-collection-toolbar">
            <input type="search" id="c-coa-search" placeholder="Search by artwork or artist name..." oninput="renderCollectorCoas()">
            <select id="c-coa-sort" onchange="renderCollectorCoas()">
                <option value="newest">Newest first</option>
                <option value="oldest">Oldest first</option>
                <option value="artist-az">Artist A-Z</option>
            </select>
        </div>

        <!-- COA GRID -->
        <div id="c-coa-grid">
            <div class="c-empty">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                <h3>Loading certificates…</h3>
            </div>
        </div>
    </main>
</div>

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="supabase-config.js"></script>
<script>
    // TRAC_ENV/TRAC_CONFIG come from supabase-config.js (shared with
    // index.html and app.html).
    const SUPABASE_URL = TRAC_CONFIG.supabaseUrl;
    const SUPABASE_ANON_KEY = TRAC_CONFIG.supabaseKey;
    // Deliberately the DEFAULT storage key, same as index.html/app.html -
    // sign-in now happens exclusively on index.html's unified modal, which
    // redirects here after establishing a session under that same default
    // key. An isolated key here used to guard against an artist's existing
    // session leaking in, but that only worked when collector.html had its
    // own separate sign-in form; now that login is unified, isolation would
    // just stop a legitimate collector session from ever being seen here at
    // all. The artist-leak case is guarded explicitly below instead, by role.
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // A confirmation/magic link lands here with #access_token=... in the URL.
    // detectSessionInUrl (default on) reads it during createClient() above and
    // stores it under this page's own isolated key - but it never removes the
    // token from the visible URL. Left alone, that token sits in the address
    // bar and rides along if the user edits the path to navigate elsewhere in
    // the same tab (e.g. .../collector#access_token=... -> .../dashboard) -
    // and since app.html/index.html also have detectSessionInUrl on by
    // default, that leftover token would sign them in there too, under their
    // own separate storage. Stripping it immediately closes that off.
    if (window.location.hash.includes('access_token')) {
        history.replaceState(null, '', window.location.pathname + window.location.search);
    }

    console.log(`🔧 TRAC environment: ${TRAC_ENV} (${SUPABASE_URL})`);
    if (TRAC_ENV === 'staging') document.title = '[STAGING] ' + document.title;

    // ==================== GLOBAL ERROR HANDLING ====================
    // Last-resort safety net for errors not already caught locally.
    (function installGlobalErrorHandling() {
        let errorCount = 0;
        let windowStart = Date.now();
        const WINDOW_MS = 10000;
        const MAX_TOASTS_PER_WINDOW = 3;

        function reportError(kind, detail) {
            console.error(`[TRAC ${kind}]`, detail);

            const now = Date.now();
            if (now - windowStart > WINDOW_MS) {
                windowStart = now;
                errorCount = 0;
            }
            errorCount++;
            if (errorCount > MAX_TOASTS_PER_WINDOW) return;

            try {
                if (typeof showCToast === 'function') {
                    showCToast('Something went wrong. Please try again.', 'error');
                }
            } catch (_) { /* must never itself throw */ }
        }

        window.addEventListener('error', function (event) {
            reportError('error', event.error || event.message || event);
        });

        window.addEventListener('unhandledrejection', function (event) {
            reportError('unhandledrejection', event.reason);
            event.preventDefault();
        });
    })();

    // Escapes a value for safe interpolation into innerHTML template
    // literals (text nodes and double-quoted HTML attributes).
    function escapeHtml(value) {
        if (value === null || value === undefined) return '';
        return String(value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    let currentCollector = null;

    // Same resolution order as index.html's signIn() - since sessions are now
    // shared by domain (no storage isolation), this is what actually stops an
    // artist's session from landing on a collector dashboard, not storage.
    async function resolveRole(user) {
        const metaRole = user.user_metadata?.role;
        if (metaRole === 'artist' || metaRole === 'collector') return metaRole;
        const { data: profileRow } = await supabaseClient
            .from('profiles').select('id').eq('id', user.id).maybeSingle();
        if (profileRow) return 'artist';
        const { data: collectorRow } = await supabaseClient
            .from('collector_accounts').select('id').eq('email', user.email.toLowerCase()).maybeSingle();
        return collectorRow ? 'collector' : 'artist';
    }

    // ==================== INIT ====================
    // No session here redirects to index.html's own auth modal (?auth=collector
    // pre-selects the Collector role there) rather than showing anything on
    // this page - sign-up/sign-in/password-reset all live on index.html now,
    // regardless of role. Password recovery links land on index.html directly
    // too (its own PASSWORD_RECOVERY listener handles them in place), so
    // there's nothing for this page to do with that event at all anymore.
    supabaseClient.auth.onAuthStateChange(async (event, session) => {
        if (session?.user) {
            const role = await resolveRole(session.user);
            if (role === 'artist') {
                // An artist and collector session must never be interchangeable
                // just because they're active in the same browser - a mismatch
                // always means "prove who you are again," never "here's your
                // other account instead."
                await supabaseClient.auth.signOut();
                window.location.href = '/?auth=collector';
                return;
            }
            currentCollector = session.user;
            await showDashboard();
            document.body.classList.add('loaded');
        } else {
            currentCollector = null;
            window.location.href = '/?auth=collector';
        }
    });

    // Check existing session
    (async () => {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (!session) {
            window.location.href = '/?auth=collector';
        }
    })();

    // ==================== SCREENS ====================
    function showScreen(id) {
        ['c-dashboard']
            .forEach(s => { const el = document.getElementById(s); if (el) el.style.display = 'none'; });
        const el = document.getElementById(id);
        if (el) el.style.display = 'block';
    }

    // Only ever called once a session is confirmed - the logged-out case
    // never needs its own nav here, since the page redirects to index.html's
    // auth modal before this could ever render for a signed-out visitor.
    function updateHeaderNav() {
        const nav = document.getElementById('c-header-nav');
        if (!nav) return;
        nav.innerHTML = `
            <button class="icon-button" onclick="collectorSignOut()" title="Sign Out">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M6 14H3.333C2.98 14 2.641 13.86 2.391 13.61C2.14 13.36 2 13.02 2 12.667V3.333C2 2.98 2.14 2.641 2.391 2.391C2.641 2.14 2.98 2 3.333 2H6"></path>
                    <path d="M10.667 11.333L14 8l-3.333-3.333"></path>
                    <path d="M14 8H6"></path>
                </svg>
            </button>`;

    // ==================== AUTH ====================
    // Sign-in/sign-up/password-reset all moved to index.html's unified auth
    // modal, regardless of role. collectorSignIn/collectorSignUp/
    // collectorResetPassword/showCollectorAuth removed entirely.

    async function collectorSignOut() {
        await supabaseClient.auth.signOut();
        currentCollector = null;
        window.location.href = '/?auth=collector';
    }

    // ==================== DASHBOARD ====================
    async function showDashboard() {
        showScreen('c-dashboard');
        updateHeaderNav();

        const { data: { user } } = await supabaseClient.auth.getUser();
        if (!user) return;

        // Set welcome name
        const name = user.user_metadata?.full_name || user.email.split('@')[0];
        const welcome = document.getElementById('c-welcome-name');
        if (welcome) welcome.textContent = name + "\u2019s Collection";

        // Link collector account if not already
        await supabaseClient.from('collector_accounts').upsert({
            email: user.email.toLowerCase(), supabase_user_id: user.id, invite_status: 'registered'
        }, { onConflict: 'email' });

        // Backfill display_name from what they told us at signup, but only
        // if nothing's there yet - never overwrite a name mint-coa already
        // captured from the artist, or one the auto-register trigger already
        // set. Same safety net role as the upsert above: the trigger is the
        // normal path, this just covers an account that confirmed before
        // that trigger existed.
        if (user.user_metadata?.full_name) {
            const { data: existing } = await supabaseClient
                .from('collector_accounts').select('display_name').eq('email', user.email.toLowerCase()).maybeSingle();
            if (!existing?.display_name) {
                await supabaseClient.from('collector_accounts')
                    .update({ display_name: user.user_metadata.full_name })
                    .eq('email', user.email.toLowerCase());
            }
        }

        await loadPendingIncomingTransfers(user.email);
        await loadCollectorCoas(user.email);
    }

    // ==================== PENDING INCOMING TRANSFERS ====================
    // A transfer someone initiated to this collector but hasn't finalized
    // yet - the artwork won't show up in the collection grid until then,
    // and without this a collector has no way to tell "nothing happened"
    // apart from "it's in progress, still waiting on the artist."
    async function loadPendingIncomingTransfers(email) {
        const section = document.getElementById('c-pending-transfers');
        if (!section) return;

        const { data: pending } = await supabaseClient
            .from('coa_pending_transfers')
            .select('id, created_at, blockchain_coas(artist_id, artworks(title))')
            .eq('new_collector_email', email.toLowerCase())
            .eq('status', 'pending')
            .order('created_at', { ascending: false });

        if (!pending || pending.length === 0) {
            section.style.display = 'none';
            section.innerHTML = '';
            return;
        }

        // coa_pending_transfers.artist_id references auth.users, not
        // profiles directly, so there's no FK PostgREST can use to embed a
        // sender name in the query above - fetched separately here, same
        // pattern used elsewhere in this app for the same reason.
        const artistIds = [...new Set(pending.map(p => p.blockchain_coas?.artist_id).filter(Boolean))];
        let artistNames = {};
        if (artistIds.length > 0) {
            const { data: artists } = await supabaseClient
                .from('profiles').select('id, full_name, username').in('id', artistIds);
            (artists || []).forEach(a => { artistNames[a.id] = a.full_name || a.username || 'An artist'; });
        }

        section.style.display = 'block';
        section.innerHTML = `
            <div style="background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;padding:1rem 1.25rem;margin-bottom:1.5rem;">
                <div style="font-size:0.85rem;font-weight:600;color:#1e3a8a;margin-bottom:0.6rem;">Incoming</div>
                <div style="display:flex;flex-direction:column;gap:0.5rem;">
                    ${pending.map(p => {
                        const title = p.blockchain_coas?.artworks?.title || 'An artwork';
                        const senderName = artistNames[p.blockchain_coas?.artist_id] || 'an artist';
                        return `<div style="font-size:0.83rem;color:#1e3a8a;">
                            <strong>${escapeHtml(title)}</strong> from ${escapeHtml(senderName)} - pending finalization
                        </div>`;
                    }).join('')}
                </div>
            </div>`;
    }

    // Raw data lives here so search/sort can re-filter and re-render without
    // re-fetching from the DB on every keystroke.
    let allCollectorCoas = [];

    async function loadCollectorCoas(email) {
        const grid = document.getElementById('c-coa-grid');
        if (!grid) return;

        // Find all ownership records for this email
        const { data: ownerships } = await supabaseClient
            .from('coa_ownership_history')
            .select('*, blockchain_coas(*, artworks(title, year, medium, dimensions, image_url))')
            .eq('owner_email', email.toLowerCase())
            .order('transfer_date', { ascending: false });

        // Find current ownership (latest transfer per CoA)
        const coaMap = new Map();
        (ownerships || []).forEach(o => {
            const coaId = o.coa_id;
            if (!coaMap.has(coaId) || new Date(o.transfer_date) > new Date(coaMap.get(coaId).transfer_date)) {
                coaMap.set(coaId, o);
            }
        });

        allCollectorCoas = [...coaMap.values()].map(o => {
            const coa = o.blockchain_coas || {};
            // blockchain_coas.metadata is stored double-encoded (mint-coa
            // JSON.stringify's it before insert even though the column is
            // jsonb) - same parse pattern already used in openCertView().
            let meta; try { meta = JSON.parse(coa.metadata || '{}'); } catch { meta = {}; }
            return { ownership: o, coa, artwork: coa.artworks || {}, artistName: meta.artist_name || '' };
        });

        renderCollectorCoas();
    }

    function renderCollectorCoas() {
        const grid = document.getElementById('c-coa-grid');
        if (!grid) return;

        if (allCollectorCoas.length === 0) {
            grid.innerHTML = `
            <div class="c-empty">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                <h3>No certificates yet</h3>
                <p>When an artist issues a CoA for an artwork you purchased, it will appear here.</p>
            </div>`;
            return;
        }

        const query = (document.getElementById('c-coa-search')?.value || '').trim().toLowerCase();
        const sortBy = document.getElementById('c-coa-sort')?.value || 'newest';

        let items = allCollectorCoas;
        if (query) {
            items = items.filter(item =>
                (item.artwork.title || '').toLowerCase().includes(query) ||
                (item.artistName || '').toLowerCase().includes(query)
            );
        }

        items = [...items].sort((a, b) => {
            if (sortBy === 'oldest') return new Date(a.ownership.transfer_date) - new Date(b.ownership.transfer_date);
            if (sortBy === 'artist-az') return (a.artistName || '').localeCompare(b.artistName || '');
            return new Date(b.ownership.transfer_date) - new Date(a.ownership.transfer_date); // newest (default)
        });

        if (items.length === 0) {
            grid.innerHTML = `<div class="c-empty"><h3>No matches</h3><p>No certificates match your search.</p></div>`;
            return;
        }

        // Same conveyor-belt layout as app.html's Dashboard/Blockchain -
        // reuses .conveyor-belt-container/-track/-item and
        // .artwork-title/.artwork-details. Badges and both actions are
        // unchanged from the previous card markup, just moved into the new
        // structure. data-artwork-* attributes on the img feed the click-to-
        // expand popup below.
        grid.innerHTML = `
            <div class="conveyor-belt-container">
                <div class="conveyor-belt-track">
                    ${items.map(({ ownership: o, coa, artwork }) => {
                        const meta = [artwork.year, artwork.medium, artwork.dimensions].filter(Boolean).map(escapeHtml).join(' · ');
                        return `
                        <div class="conveyor-item artwork-card" data-coa-id="${coa.id}">
                            <div class="artwork-image">
                                ${artwork.image_url
                                    ? `<img src="${escapeHtml(artwork.image_url)}" alt="${escapeHtml(artwork.title || '')}" loading="lazy"
                                           data-artwork-title="${escapeHtml(artwork.title || 'Untitled')}"
                                           data-artwork-year="${escapeHtml(artwork.year || '')}"
                                           data-artwork-medium="${escapeHtml(artwork.medium || '')}"
                                           data-artwork-dimensions="${escapeHtml(artwork.dimensions || '')}">`
                                    : `<div style="width:100%;height:100%;background:#f5f5f5;display:flex;align-items:center;justify-content:center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ccc" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg></div>`
                                }
                            </div>
                            <div class="artwork-info">
                                <div>
                                    <h3 class="artwork-title">${escapeHtml(artwork.title) || 'Untitled'}</h3>
                                    <div class="artwork-details">${meta || 'Physical artwork'}</div>
                                    <div style="display:flex;gap:0.4rem;flex-wrap:wrap;margin-top:0.5rem;">
                                        <span class="c-badge c-badge-green">Certified</span>
                                        <span class="c-badge c-badge-blue">${coa.royalty_pct || 0}% royalty</span>
                                        <span class="c-badge c-badge-gray">${escapeHtml(coa.network) || 'Polygon'}</span>
                                        ${o.is_original_purchase ? '<span class="c-badge c-badge-gray">Original buyer</span>' : '<span class="c-badge c-badge-gray">Secondary owner</span>'}
                                    </div>
                                </div>
                                <div style="display:flex;gap:0.5rem;margin-top:0.75rem;">
                                    <button onclick="openCertView('${coa.id}')" style="flex:1;padding:0.6rem;font-size:0.8rem;border-radius:8px;font-family:inherit;cursor:pointer;transition:all 0.2s;background:white;border:1px solid #d1d1d1;color:#000;" onmouseenter="this.style.borderColor='#000'" onmouseleave="this.style.borderColor='#d1d1d1'">View CoA</button>
                                    <button data-coa-id="${coa.id}" data-artwork-title="${escapeHtml(artwork.title || '')}" onclick="openDisputeModal(this.dataset.coaId, this.dataset.artworkTitle)" style="flex:1;padding:0.6rem;font-size:0.8rem;border-radius:8px;font-family:inherit;cursor:pointer;transition:all 0.2s;background:white;border:1px solid #d1d1d1;color:#b91c1c;" onmouseenter="this.style.borderColor='#b91c1c'" onmouseleave="this.style.borderColor='#d1d1d1'">Report an Issue</button>
                                </div>
                            </div>
                        </div>`;
                    }).join('')}
                </div>
            </div>
        `;
    }

    // ==================== ARTWORK IMAGE POPUP ====================
    // Click-to-expand, matching Blockchain's behavior in app.html (not
    // Dashboard's - app.html deliberately disables this there via
    // disableDashboardPopups). Self-contained: collector.html shares no JS
    // with app.html, so this doesn't call or import anything from it.
    // Scoped to #c-coa-grid and to the <img> itself specifically, so it
    // can never fire from clicking "View CoA" or "Report an Issue".
    document.addEventListener('click', function (e) {
        const grid = document.getElementById('c-coa-grid');
        if (!grid || !e.target.matches('.artwork-image img')) return;
        if (!grid.contains(e.target)) return;

        const img = e.target;
        openCArtworkPopup(
            img.src,
            img.getAttribute('data-artwork-title') || 'Untitled',
            img.getAttribute('data-artwork-year') || '',
            img.getAttribute('data-artwork-medium') || '',
            img.getAttribute('data-artwork-dimensions') || ''
        );

    function openCArtworkPopup(imageSrc, title, year, medium, dimensions) {
        const popup = document.getElementById('c-artwork-popup');
        const popupImg = document.getElementById('c-popup-img');
        const popupInfo = document.getElementById('c-popup-info');
        if (!popup || !popupImg || !popupInfo) return;

        popupImg.src = imageSrc;
        popupImg.alt = title || '';

        let infoHTML = `<div class="title">${escapeHtml(title)}</div>`;
        if (year) infoHTML += `<div class="detail">${escapeHtml(year)}</div>`;
        if (medium) infoHTML += `<div class="detail">${escapeHtml(medium)}</div>`;
        if (dimensions) infoHTML += `<div class="detail">${escapeHtml(dimensions)}</div>`;
        popupInfo.innerHTML = infoHTML;

        popup.style.display = 'flex';
    }

    function closeCArtworkPopup() {
        const popup = document.getElementById('c-artwork-popup');
        if (popup) popup.style.display = 'none';
    }

    });

    // Reporting a sale/transfer is now artist-attested only (see CLAUDE.md's
    // Product Architecture Ground Truth) — the collector-initiated "Report a
    // Sale" flow that used to live here has moved to app.html's "Report
    // Transfer" action, which the artist uses after verifying a sale themselves.

    // ==================== REPORT AN ISSUE ====================
    // Collector dashboard stays view-only for ownership — this creates a review
    // record only, no automatic reversal or correction. The burn-and-reissue
    // correction workflow is separate, not-yet-built functionality.
    function openDisputeModal(coaId, artworkTitle) {
        const modal = document.createElement('div');
        modal.className = 'c-modal-overlay';
        modal.innerHTML = `
        <div class="c-modal">
            <div class="c-modal-header">
                <div>
                    <h3>Report an Issue</h3>
                    <p style="font-size:0.8rem;color:#666;margin-top:0.2rem;">${escapeHtml(artworkTitle)}</p>

                This flags the record for TRAC to review — it doesn't change or correct anything automatically.
            </div>

                <label>What's wrong? (optional)</label>

                <button onclick="this.closest('.c-modal-overlay').remove()" style="flex:1;padding:0.875rem;border:1px solid #d1d1d1;border-radius:8px;background:white;font-size:0.9rem;cursor:pointer;font-family:inherit;">Cancel</button>
                <button id="d-submit-btn" data-coa-id="${coaId}" onclick="submitDispute(this.dataset.coaId)" style="flex:2;padding:0.875rem;background:#b91c1c;color:white;border:none;border-radius:8px;font-size:0.9rem;cursor:pointer;font-family:inherit;font-weight:500;">Submit Report</button>
            </div>
        </div>`;
        modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });
        document.body.appendChild(modal);
    }

    async function submitDispute(coaId) {
        const note = document.getElementById('d-note').value.trim();
        const btn = document.getElementById('d-submit-btn');
        btn.disabled = true; btn.textContent = 'Submitting…';

        try {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user) throw new Error('Not authenticated');

            const { error } = await supabaseClient.from('coa_disputes').insert({
                collector_id: user.id,
                coa_id: coaId,
                note: note || null
            });
            if (error) throw error;

            document.querySelector('.c-modal-overlay')?.remove();
            showCToast('Reported. TRAC will review this record.');
        } catch (err) {
            console.error('Dispute error:', err);
            showCToast('Error: ' + (err.message || 'Something went wrong'), 'error');
            btn.disabled = false; btn.textContent = 'Submit Report';
        }
    }

    // ==================== UTILITIES ====================
    function showCToast(msg, type = 'success') {
        const t = document.getElementById('c-toast');
        t.textContent = msg; t.className = type === 'error' ? 'error' : '';
        t.style.display = 'block';
        setTimeout(() => { t.style.display = 'none'; }, 3500);
    }
</script>
</body>
